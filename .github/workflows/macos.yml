name: macOS

# Tests on every push to main and every pull request. A release is built and
# published by running this workflow by hand with the version (it must be the
# VERSION in macos/scripts/make-dmg.sh and the first entry of
# macos/RELEASE_NOTES.md), or by pushing a v<version> tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.0.17 (empty: only test)"
        required: false
        type: string
      mutation:
        description: "Run the mutation tests instead of the normal tests"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    if: ${{ !inputs.mutation }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build the simulator
        run: cmake -S simulator -B simulator/build && cmake --build simulator/build
      - name: Test
        working-directory: macos
        env:
          CPSIM_BIN: ${{ github.workspace }}/simulator/build/processor_sim
        run: swift test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="${{ inputs.version }}"; fi
          script="$(sed -n 's/^VERSION="\(.*\)"/\1/p' macos/scripts/make-dmg.sh)"
          [ "$version" = "$script" ] || { echo "version $version differs from make-dmg.sh $script" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the disk image
        run: macos/scripts/make-dmg.sh "$RUNNER_TEMP/dist"
      - name: Check the disk image
        run: macos/scripts/check-dmg.sh "$RUNNER_TEMP/dist/CPRemote-${{ steps.v.outputs.version }}.dmg" "${{ steps.v.outputs.version }}"
      - name: Release notes of this version
        run: |
          awk -v h="## ${{ steps.v.outputs.version }} " 'index($0,h)==1{f=1;next} /^## /{f=0} f' macos/RELEASE_NOTES.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          printf '\n' >> "$RUNNER_TEMP/notes.md"
          cat macos/INSTALL.md >> "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          gh release create "v$v" "$RUNNER_TEMP/dist/CPRemote-$v.dmg" "$RUNNER_TEMP/dist/CPRemote.dmg" \
            --title "CP Remote $v" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"

  # Mutation testing (macos/scripts/mutate.py): change one operator at a time
  # in the sources and see whether the tests notice. Only the tests that need
  # no simulator run, so each mutant takes under a minute. Survivors are listed
  # in the job summary.
  mutation:
    if: ${{ inputs.mutation }}
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: framing
            files: "Sources/CPx50Comms/LineBuffer.swift Sources/CPx50Comms/CommandQueue.swift Sources/CPx50Comms/ProtocolTiming.swift"
            max: 40
          - name: wire
            files: "Sources/CPx50Comms/WireProtocol.swift"
            max: 40
          - name: serial
            files: "Sources/CPx50Comms/SerialTransport.swift"
            max: 60
    steps:
      - uses: actions/checkout@v4
      - name: Mutate ${{ matrix.name }}
        working-directory: macos
        run: python3 scripts/mutate.py --max ${{ matrix.max }} --out "$RUNNER_TEMP/mutation" ${{ matrix.files }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.name }}
          path: ${{ runner.temp }}/mutation
